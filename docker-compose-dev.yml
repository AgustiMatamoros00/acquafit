services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "AcquaFit2024!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P AcquaFit2024! -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    image: acquafit-windows/backend
    build:
      context: ./backend
      target: devel
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "3000:3000"
      - "9229:9229"  # Puerto para debugging
    environment:
      DB_HOST: database
      DB_USER: sa
      DB_PASSWORD: "AcquaFit2024!"
      DB_NAME: acquafit
      DB_PORT: 1433
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    image: acquafit-windows/frontend
    build:
      context: ./frontend
      target: devel
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:4200"  # Puerto de Angular
    environment:
      - NODE_ENV=development
      - NG_CLI_ANALYTICS=false
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true

volumes:
  sqlserver_data:
    driver: local

