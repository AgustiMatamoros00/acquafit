services:
  database:
    image: api/database
    build:
      context: ./database
      target: devel
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: acquafit
    ports:
      - "5432:5432"
    volumes:
      - ./database/entrypoint:/docker-entrypoint-initdb.d/
    #Esto es un healthcheck para que el contenedor de la base de datos se reinicie si no está funcionando
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: database
    depends_on:
      #Esto es un healthcheck para que el contenedor de adminer se reinicie si no está funcionando la database
      database:
        condition: service_healthy

  backend:
    image: api/backend
    build:
      context: ./backend
      target: devel
    restart: unless-stopped
    depends_on:
      #Esto es un healthcheck para que el contenedor de backend se reinicie si no está funcionando la database
      database:
        condition: service_healthy
    ports:
      - "3000:3000"
      - "9229:9229"  # Puerto para debugging
    environment:
      DB_HOST: database
      DB_USER: postgres
      DB_PASSWORD: acquafit
      DB_NAME: postgres
      DB_PORT: 5432
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    image: api/frontend
    build:
      context: ./frontend
      target: devel
    restart: unless-stopped
    ports:
      - "4200:4200"  # Puerto de Angular
    environment:
      - NODE_ENV=development
      - NG_CLI_ANALYTICS=false
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
      
    
