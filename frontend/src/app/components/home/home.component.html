<div class="home-content">
    <h1>¡Bienvenido a AcquaFit!</h1>
    <p>Tu aplicación de tracking de entrenamientos</p>

    <!-- Estado de carga -->
    <div class="loading-state" *ngIf="isLoading">
        <div class="spinner"></div>
        <p>Cargando información del usuario...</p>
    </div>

    <!-- Estado de error -->
    <div class="error-state" *ngIf="error && !isLoading">
        <p class="error-message">{{ error }}</p>
        <button class="btn btn-secondary" (click)="loadUserData()">
            Reintentar
        </button>
    </div>

    <div class="center-div">
        <button class="card-1" *ngIf="userData && !isLoading" (click)="goInfo()">
            Información del Usuario
        </button>
        <button class="card-1">
            Ver mis rutinas
        </button>
        <button class="card-1">
            Ver mis ejercicios favoritos
        </button>
        <button class="card-1">
            Ver mis estadísticas
        </button>
        <button class="card-1">
            Registrar nuevo entrenamiento
        </button>
        <button class="card-1">
            Historial de entrenamientos
        </button>
        <button class="card-1">
            Crear nueva rutina
        </button>
        <button class="card-1">
            Progreso mensual
        </button>
        <button class="card-1">
            Objetivos y metas
        </button>
    </div>
</div>
